<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6A13">
<title>北大医疗 · 职工健康管理</title>
<style>
:root{
  --orange:#FF6A13; --orange-d:#F04E00; --orange-l:#FF933B; --amber:#FFB020;
  --tint:#FFF3E9; --tint-2:#FFE7D5;
  --ink:#191A1C; --ink-2:#5E626A; --ink-3:#9AA0A8; --line:#EFEFF3;
  --bg:#F5F6F8; --white:#fff;
  --green:#0E9F6E; --blue:#2F6BFF; --pink:#E24C86; --gold:#C8860A;
  --navy:#123B54;
  --r:18px;
  --shadow:0 6px 22px rgba(24,26,32,.06);
  --tab-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#E9EBEF;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;-webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;border:none;background:none;padding:0;color:inherit;cursor:pointer}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}
::-webkit-scrollbar{width:0;height:0}
.phone{
  position:relative;width:100%;max-width:430px;background:#fff;
  height:var(--app-h,100%);overflow:hidden;display:flex;flex-direction:column;
}
@media(max-width:559px){body{background:#fff}}
@media(min-width:560px){
  body{background:radial-gradient(1200px 600px at 50% -10%,#FFF1E6 0%,#E9EBEF 60%)}
  .phone{height:min(920px,calc(100dvh - 36px));border-radius:38px;box-shadow:0 40px 90px rgba(20,24,30,.22),0 0 0 9px #17191d,0 0 0 10px #2b2f36}
}
/* ---------- generic ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:1}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--tab-h) + 26px);position:relative;-webkit-overflow-scrolling:touch}
.subview{z-index:20;background:#fff}
.subview.detail{background:#F5F6F8}
.subview .scroll{padding-bottom:28px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin:22px 0 12px}
.section-title h3{margin:0;font-size:17px;letter-spacing:-.2px}
.section-title span{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:2px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:0 16px}
.chev{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 9px;border-radius:8px;background:var(--tint);color:var(--orange-d);font-weight:500}
.chip.grey{background:#F3F4F6;color:var(--ink-2)}
.chip.blue{background:#EDF3FF;color:var(--blue)}
.chip.green{background:#E9F7F1;color:var(--green)}
/* ---------- home hero ---------- */
.hero{
  background:linear-gradient(168deg,#FF8A2B 0%,#FF6A13 46%,#F5520A 100%);
  padding:0 0 26px;border-radius:0 0 26px 26px;position:relative;overflow:hidden;flex:0 0 auto;
}
.hero::before{
  content:"";position:absolute;width:320px;height:320px;right:-120px;top:-160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.32),rgba(255,255,255,0) 66%);
}
.hero::after{
  content:"";position:absolute;width:180px;height:180px;left:-80px;top:40px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);
}
.topbar{display:flex;align-items:center;gap:9px;padding:0 18px;position:relative;z-index:2;margin-top:2px}
.city{display:flex;align-items:center;gap:3px;color:#fff;font-size:14px;font-weight:600;flex:0 0 auto}
.searchbox{
  flex:1;height:38px;background:rgba(255,255,255,.96);border-radius:19px;display:flex;align-items:center;gap:6px;
  padding:0 13px;font-size:13px;color:#9AA0A8;min-width:0;
}
.searchbox svg{width:15px;height:15px;flex:0 0 auto;stroke:#B0B5BD;fill:none;stroke-width:2.2;stroke-linecap:round}
.msgbtn{position:relative;width:32px;height:32px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.msgbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{
  position:absolute;top:1px;right:-1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:#FF3B30;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:1.5px solid #FF7A22;
}
.quick-pill{
  flex:0 0 auto;height:32px;padding:0 11px;border-radius:16px;background:rgba(255,255,255,.2);
  color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px;white-space:nowrap;
  border:1px solid rgba(255,255,255,.36);
}
.greet{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 18px 0;position:relative;z-index:2}
.greet h1{margin:0;font-size:21px;line-height:1.32;color:#fff;letter-spacing:-.4px;font-weight:700;text-shadow:0 1px 6px rgba(180,60,0,.16)}
.greet p{margin:6px 0 0;font-size:12px;color:rgba(255,255,255,.86);display:flex;align-items:center;gap:6px}
.greet p b{font-weight:600;background:rgba(255,255,255,.2);padding:2px 7px;border-radius:6px;font-size:11px}
.avatar{position:relative;width:64px;height:64px;flex:0 0 auto;margin-top:-2px}
.avatar .ring{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55)}
.avatar svg{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 6px 16px rgba(150,50,0,.24)}
.avatar .dot{position:absolute;right:1px;bottom:3px;width:11px;height:11px;border-radius:50%;background:#34D07C;border:2px solid #FF6A13}
/* ask card */
.ask{
  margin:16px 14px 0;background:#fff;border-radius:20px;padding:16px 15px 12px;position:relative;z-index:2;
  box-shadow:0 12px 30px rgba(160,60,0,.14);
}
.ask-head{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700;letter-spacing:-.2px}
.ask-head .rot{color:#C9CDD4}
.ask-head .rot svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ask-row{display:flex;align-items:center;gap:8px;margin-top:13px;flex-wrap:wrap}
.ask-key{font-size:13px;color:#7A7F88;width:40px;flex:0 0 auto}
.ask-chips{display:flex;gap:8px;flex-wrap:wrap}
.ask-chip{
  padding:6px 13px;border-radius:15px;font-size:12.5px;background:#FFF7F1;color:#8A5B38;
  border:1px solid #FFE8D7;font-weight:500;
}
.ask-chip.on{background:var(--tint-2);border-color:#FFC79E;color:var(--orange-d);font-weight:600}
.ask-foot{display:flex;align-items:center;gap:9px;margin-top:16px;padding-top:12px;border-top:1px solid #F4F1EE}
.ask-act{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#5E626A;padding:6px 4px;font-weight:500}
.ask-act svg{width:16px;height:16px;stroke:var(--orange);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ask-act+.ask-act{padding-left:12px;border-left:1px solid #F0EEEC}
.ask-go{
  margin-left:auto;height:34px;padding:0 20px;border-radius:17px;color:#fff;font-size:13px;font-weight:600;
  background:linear-gradient(135deg,#FF8A3D,#FF5A0C);box-shadow:0 6px 14px rgba(255,90,12,.28);
}
/* grid */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 4px;padding:20px 12px 4px;background:transparent}
.gitem{display:flex;flex-direction:column;align-items:center;gap:7px}
.gicon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.gicon svg{width:24px;height:24px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gitem span{font-size:11.5px;color:#3C4048;letter-spacing:-.2px;white-space:nowrap}
/* quota */
.quota{margin:8px 14px 0;padding:15px 16px;border-radius:18px;background:linear-gradient(115deg,#FFF8F2,#FFEFE2);border:1px solid #FFE4CE;display:flex;align-items:center;gap:12px}
.quota .q-num{font-size:26px;font-weight:800;color:var(--orange-d);letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.quota .q-num small{font-size:13px;font-weight:700;margin-right:1px}
.quota .q-mid{flex:1;min-width:0}
.quota .q-mid .t{font-size:12px;color:#8A6039;margin-bottom:6px;display:flex;justify-content:space-between}
.quota .q-bar{height:5px;border-radius:3px;background:#FFDFC4;overflow:hidden}
.quota .q-bar i{display:block;height:100%;width:42%;border-radius:3px;background:linear-gradient(90deg,#FFB020,#FF6A13)}
.quota .q-btn{font-size:11.5px;color:var(--orange-d);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:1px}
/* banner */
.section-title + .banner{margin-top:0}
.banner{margin:16px 14px 0;border-radius:18px;overflow:hidden;position:relative;height:104px}
.bslide{position:absolute;inset:0;display:flex;align-items:center;padding:0 18px;opacity:0;transition:opacity .6s;pointer-events:none}
.bslide.on{opacity:1;pointer-events:auto}
.bslide h4{margin:0;font-size:16.5px;color:#fff;font-weight:700;letter-spacing:-.3px}
.bslide p{margin:5px 0 0;font-size:11.5px;color:rgba(255,255,255,.82)}
.bslide .b-tag{display:inline-block;margin-top:8px;font-size:10.5px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.3)}
.bslide .art{position:absolute;right:-6px;bottom:-10px;opacity:.9}
.bdots{position:absolute;right:12px;bottom:9px;display:flex;gap:4px;z-index:3}
.bdots i{width:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.45);transition:.3s}
.bdots i.on{width:12px;background:#fff}
/* task card */
.task{margin:14px 14px 0;padding:14px 15px;display:flex;align-items:center;gap:12px}
.task .ti{width:40px;height:40px;border-radius:12px;background:var(--tint);display:grid;place-items:center;flex:0 0 auto}
.task .ti svg{width:21px;height:21px;stroke:var(--orange);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.task .tm{flex:1;min-width:0}
.task .tm b{font-size:14px;font-weight:600;display:block;letter-spacing:-.2px}
.task .tm span{font-size:11.5px;color:var(--ink-3);display:block;margin-top:3px}
.task .go{font-size:12px;font-weight:600;color:var(--orange-d);background:var(--tint);padding:7px 12px;border-radius:12px;white-space:nowrap}
/* signin */
.signin{margin:14px 14px 0;background:#fff;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.signin b{font-size:14px;color:var(--ink)}
.signin span{font-size:12px;color:#8A6039;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.signin .sbtn{font-size:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,#FFB020,#FF7A18);padding:6px 14px;border-radius:12px}
/* tabbar */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + 6px);
  background:#fff;border-top:1px solid #F0F1F4;
  display:flex;align-items:stretch;padding:0;z-index:50;
}
.tab{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#9BA0A8;padding:0}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;letter-spacing:-.2px;line-height:1.15}
.tab.on{color:var(--orange);font-weight:600}
.tab.ai{position:relative;color:var(--orange)}
.tab.ai .aiball{
  width:27px;height:27px;border-radius:50%;background:linear-gradient(140deg,#FFB020,#FF5A0C);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;font-style:italic;box-shadow:0 4px 10px rgba(255,90,12,.3);
}
/* ---------- products ---------- */
.pheader{background:linear-gradient(168deg,#FF8A2B,#F5520A);padding:calc(12px + env(safe-area-inset-top)) 16px 16px;color:#fff}
.pheader h2{margin:6px 0 4px;font-size:22px;letter-spacing:-.5px}
.pheader p{margin:0 0 14px;font-size:12px;color:rgba(255,255,255,.82)}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 2px;justify-content:space-between}
.ptab{flex:0 0 auto;padding:6px 11px;border-radius:13px;font-size:12px;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.26);white-space:nowrap}
.ptab.on{background:#fff;color:var(--orange-d);font-weight:700;border-color:#fff}
.mod{background:#fff;margin:12px 14px 0;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.mod-head{padding:15px 15px;display:flex;align-items:center;gap:12px}
.mod-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}
.mod-ico svg{width:23px;height:23px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mod-h{flex:1;min-width:0}
.mod-h b{font-size:15.5px;display:block;letter-spacing:-.2px}
.mod-h span{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:block}
.mod-n{font-size:11px;color:var(--ink-3)}
.pitem{padding:12px 15px;border-top:1px solid #F5F5F8;display:flex;gap:11px;align-items:flex-start;background:#fff}
.pitem .ck{
  width:19px;height:19px;border-radius:6px;border:1.6px solid #D8DBE1;flex:0 0 auto;margin-top:2px;
  display:grid;place-items:center;transition:.16s;background:#fff;
}
.pitem .ck svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pitem.sel .ck{background:linear-gradient(135deg,#FF8A3D,#F5520A);border-color:transparent}
.pitem.sel .ck svg{opacity:1}
.pitem .pi{flex:1;min-width:0}
.pitem .pi b{font-size:13.5px;font-weight:600;letter-spacing:-.2px;display:block}
.pitem .pi p{margin:3px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pitem .tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.pitem .arw{color:#C9CDD4;align-self:center;margin-top:2px}
.selbar{
  position:absolute;left:12px;right:12px;bottom:calc(var(--tab-h) + 10px);z-index:45;
  background:#1B1D21;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;
  color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.24);backdrop-filter:blur(8px);
}
.selbar .s1{font-size:12px;color:rgba(255,255,255,.66)}
.selbar .s1 b{font-size:17px;color:#FFB020;margin:0 2px;font-variant-numeric:tabular-nums}
.selbar button{
  margin-left:auto;height:38px;padding:0 18px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#FF8A3D,#F5520A);
}
/* ---------- detail ---------- */
.detail-hero{padding:calc(14px + env(safe-area-inset-top)) 18px 24px;color:#fff;position:relative;overflow:hidden}
.detail-hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-90px;top:-90px;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 70%)}
.detail-hero .d-tags{display:flex;gap:6px;margin-bottom:12px;position:relative;z-index:2;flex-wrap:wrap}
.detail-hero .d-tags i{font-style:normal;font-size:11px;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}
.detail-hero h1{margin:0;font-size:23px;line-height:1.36;letter-spacing:-.5px;position:relative;z-index:2}
.detail-hero .en{margin:6px 0 0;font-size:11px;color:rgba(255,255,255,.66);letter-spacing:.3px;position:relative;z-index:2;text-transform:uppercase}
.detail-hero .d-intro{margin:12px 0 0;font-size:12.5px;line-height:1.7;color:rgba(255,255,255,.9);position:relative;z-index:2}
.dcard{background:#fff;border-radius:18px;margin:12px 14px 0;padding:16px;box-shadow:var(--shadow)}
.dcard h4{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:7px;letter-spacing:-.2px}
.dcard h4::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--orange)}
.inc{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #F1F2F5;font-size:12.5px;color:#4A4E55;line-height:1.55}
.inc:last-child{border-bottom:none;padding-bottom:0}
.inc i{font-style:normal;width:18px;height:18px;border-radius:6px;background:var(--tint);color:var(--orange-d);font-size:10px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.flow{display:flex;gap:0;margin-top:4px}
.fstep{flex:1;text-align:center;position:relative;padding:0 2px}
.fstep .n{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--orange-d);font-size:11px;font-weight:700;display:grid;place-items:center;margin:0 auto 7px;position:relative;z-index:2}
.fstep .l{font-size:10.5px;color:#5E626A;line-height:1.35}
.fstep::before{content:"";position:absolute;left:0;right:50%;top:12px;height:1px;background:#FFE0C8}
.fstep::after{content:"";position:absolute;left:50%;right:0;top:12px;height:1px;background:#FFE0C8}
.fstep:first-child::before,.fstep:last-child::after{display:none}
.org{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:12.5px;color:#4A4E55;border-bottom:1px solid #F5F6F8}
.org:last-child{border-bottom:none}
.org svg{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:1.7;flex:0 0 auto}
.org em{font-style:normal;margin-left:auto;font-size:11px;color:var(--ink-3)}
.dock{
  position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);border-top:1px solid #F2F3F6;display:flex;align-items:center;gap:10px;z-index:40;
}
.dock .fav{width:48px;text-align:center;color:#6E737B;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto}
.dock .fav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock .primary{flex:1;height:46px;border-radius:14px;background:linear-gradient(135deg,#FF8A3D,#F5520A);color:#fff;font-size:15px;font-weight:600;box-shadow:0 8px 18px rgba(245,82,10,.28)}
/* sub header */
.subhead{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) 14px 0;height:calc(50px + env(safe-area-inset-top));background:#fff;
  border-bottom:1px solid #F4F5F7;position:relative;z-index:10;
}
.subhead .back{width:30px;height:30px;display:grid;place-items:center;margin-left:-6px}
.subhead .back svg{width:21px;height:21px;stroke:#191A1C;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subhead b{font-size:16px;letter-spacing:-.2px;flex:1;text-align:center;margin-right:24px}
.subhead .ext{position:absolute;right:14px;font-size:12px;color:var(--ink-2)}
/* ---------- services page ---------- */
.stat-row{display:flex;gap:10px;margin:12px 14px 0}
.stat-cell{flex:1;background:#fff;border-radius:16px;padding:14px 12px;box-shadow:var(--shadow)}
.stat-cell b{display:block;font-size:23px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat-cell span{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:block}
.rec{background:#fff;border-radius:16px;margin:10px 14px 0;padding:14px 15px;display:flex;gap:12px;box-shadow:var(--shadow)}
.rec .rt{width:56px;flex:0 0 auto;text-align:center;border-right:1px solid #F2F3F6;padding-right:10px}
.rec .rt b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.rec .rt span{font-size:10.5px;color:var(--ink-3);display:block;margin-top:3px}
.rec .rb{flex:1;min-width:0}
.rec .rb b{font-size:13.5px;display:block;letter-spacing:-.2px}
.rec .rb p{margin:4px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.55}
.rec .st{align-self:flex-start;font-size:10.5px;padding:3px 7px;border-radius:6px;background:#E9F7F1;color:#0E9F6E;white-space:nowrap}
.rec .st.done{background:#F3F4F6;color:#8A8F98}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3);font-size:12.5px}
/* ---------- discover ---------- */
.article{background:#fff;border-radius:16px;margin:10px 14px 0;padding:14px;display:flex;gap:13px;box-shadow:var(--shadow)}
.article .thumb{width:78px;border-radius:12px;flex:0 0 auto;position:relative;overflow:hidden;align-self:stretch;min-height:76px}
.article .ab{flex:1;min-width:0;display:flex;flex-direction:column}
.article .ab b{font-size:13.5px;line-height:1.45;letter-spacing:-.2px}
.article .ab .meta{margin-top:auto;font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.article .ab .meta i{font-style:normal;color:#D9DCE1}
.ind{background:#fff;border-radius:16px;margin:10px 14px 0;padding:14px 15px;box-shadow:var(--shadow)}
.ind-head{display:flex;align-items:center;gap:8px}
.ind-head b{font-size:14px}
.ind-head span{font-size:11px;color:var(--ink-3);margin-left:auto}
.ind p{margin:8px 0 0;font-size:12px;color:#5E626A;line-height:1.62}
.ind .prod{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ind .prod i{font-style:normal;font-size:10.5px;padding:4px 8px;border-radius:7px;background:#F6F7F9;color:#6E7379}
/* ---------- mine ---------- */
.mine-hero{background:linear-gradient(168deg,#FF8A2B,#F5520A);padding:0 18px 56px;color:#fff;position:relative;overflow:hidden}
.mine-hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-100px;top:-110px;background:radial-gradient(circle,rgba(255,255,255,.24),transparent 70%)}
.muser{display:flex;align-items:center;gap:13px;position:relative;z-index:2;padding-top:6px}
.muser .av{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.6);flex:0 0 auto}
.muser .av svg{width:100%;height:100%}
.muser .mi b{font-size:18px;letter-spacing:-.2px}
.muser .mi p{margin:4px 0 0;font-size:11.5px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px}
.muser .mi p em{font-style:normal;background:rgba(255,255,255,.2);padding:2px 6px;border-radius:5px}
.mstats{display:flex;margin:20px 4px 0;position:relative;z-index:2}
.mstats div{flex:1;text-align:center;color:#fff}
.mstats b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mstats span{display:block;font-size:11px;color:rgba(255,255,255,.76);margin-top:3px}
.mcard{background:#fff;border-radius:18px;margin:-40px 14px 0;padding:6px 0;box-shadow:0 8px 24px rgba(80,40,10,.1);position:relative;z-index:3}
.mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F5F6F8;font-size:13.5px}
.mrow:last-child{border-bottom:none}
.mrow .mi2{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.mrow .mi2 svg{width:17px;height:17px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mrow .mv{margin-left:auto;color:var(--ink-3);font-size:12px;display:flex;align-items:center;gap:2px}
/* brands strip */
.brands{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 10px 6px;opacity:.62}
.brands div{font-size:10.5px;color:#8A8F98;display:flex;align-items:center;gap:4px}
.brands i{width:4px;height:4px;border-radius:50%;background:#C9CDD4;display:block}
/* ---------- overlays ---------- */
.backdrop{position:absolute;inset:0;background:rgba(17,19,23,.46);z-index:60;opacity:0;pointer-events:none;transition:opacity .24s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:61;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.9,.3,1);max-height:86%;display:flex;flex-direction:column;
}
.sheet.on{transform:translateY(0)}
.sheet-h{padding:16px 18px 10px;display:flex;align-items:center}
.sheet-h b{font-size:16px;letter-spacing:-.2px}
.sheet-h .x{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#F4F5F7;color:#8A8F98;display:grid;place-items:center;font-size:16px}
.sheet-b{padding:0 18px 18px;overflow-y:auto}
.field{margin-bottom:16px}
.field .fl{font-size:12.5px;color:#5E626A;margin-bottom:9px;font-weight:500}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:9px 13px;border-radius:12px;background:#F5F6F8;font-size:12.5px;color:#3C4048;border:1px solid transparent;line-height:1.3;text-align:center}
.opt small{display:block;font-size:10px;color:var(--ink-3);margin-top:2px}
.opt.on{background:var(--tint);border-color:#FFB77F;color:var(--orange-d);font-weight:600}
.opt.on small{color:#C7763B}
.sheet .primary{width:100%;height:46px;border-radius:14px;background:linear-gradient(135deg,#FF8A3D,#F5520A);color:#fff;font-size:15px;font-weight:600;margin-top:4px}
/* toast */
.toast{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.94);z-index:99;
  background:rgba(20,22,26,.88);color:#fff;font-size:13px;padding:12px 18px;border-radius:12px;
  opacity:0;pointer-events:none;transition:.22s;max-width:74%;text-align:center;line-height:1.5;backdrop-filter:blur(6px);
}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* search overlay */
.searchview{position:absolute;inset:0;background:#fff;z-index:70;display:flex;flex-direction:column;transform:translateY(6%);opacity:0;pointer-events:none;transition:.24s}
.searchview.on{transform:none;opacity:1;pointer-events:auto}
.sv-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #F4F5F7}
.sv-top .sb{flex:1;height:38px;background:#F5F6F8;border-radius:19px;display:flex;align-items:center;gap:7px;padding:0 13px}
.sv-top .sb input{flex:1;font-size:13px}
.sv-top .sb svg{width:15px;height:15px;stroke:#9AA0A8;fill:none;stroke-width:2.2}
.sv-top .cancel{font-size:13px;color:var(--ink-2)}
.sv-body{flex:1;overflow-y:auto;padding:14px}
.sv-label{font-size:12px;color:var(--ink-3);margin:4px 0 10px}
.sv-row{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid #F6F7F9;font-size:13.5px}
.sv-row .si{width:32px;height:32px;border-radius:10px;background:var(--tint);display:grid;place-items:center;flex:0 0 auto}
.sv-row .si svg{width:17px;height:17px;stroke:var(--orange);fill:none;stroke-width:1.8}
.sv-row span{color:var(--ink-3);font-size:11.5px;margin-left:auto}
/* qa modal */
.qawrap{position:absolute;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.qawrap .bd{position:absolute;inset:0;background:rgba(16,18,22,.5);opacity:0;transition:.24s}
.qawrap.on{pointer-events:auto}
.qawrap.on .bd{opacity:1}
.qapanel{
  position:relative;width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(103%);transition:transform .32s cubic-bezier(.3,.9,.3,1);max-height:88%;overflow-y:auto;
}
.qawrap.on .qapanel{transform:none}
.qapanel .qh{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.qapanel .qh .ai{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#FFB020,#FF5A0C);color:#fff;display:grid;place-items:center;font-weight:800;font-style:italic;font-size:14px}
.qapanel .qh b{font-size:16px}
.qapanel .qs{font-size:13px;color:var(--ink-2);margin:12px 0 12px;line-height:1.6}
.qopt{display:flex;align-items:center;gap:8px;padding:12px 13px;border-radius:12px;background:#F7F8FA;margin-bottom:8px;font-size:13px;color:#3C4048}
.qopt .r{width:16px;height:16px;border-radius:50%;border:1.5px solid #D3D7DD;margin-left:auto;flex:0 0 auto}
.qopt.on{background:var(--tint);color:var(--orange-d);font-weight:600}
.qopt.on .r{border:5px solid var(--orange);background:#fff}
.qres{background:linear-gradient(150deg,#FFF8F2,#FFEFE3);border-radius:16px;padding:15px;margin-bottom:12px}
.qres .rt{font-size:12px;color:#A2652F;margin-bottom:8px}
.qres b{font-size:15px;letter-spacing:-.2px}
.qres p{font-size:12px;color:#7A5B42;line-height:1.65;margin:6px 0 0}
.qprod{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(120,70,30,.06)}
.qprod .qi{width:34px;height:34px;border-radius:10px;background:var(--tint);display:grid;place-items:center;flex:0 0 auto}
.qprod .qi svg{width:18px;height:18px;stroke:var(--orange);fill:none;stroke-width:1.8}
.qprod b{font-size:12.5px;display:block}
.qprod span{font-size:10.5px;color:var(--ink-3)}
.qprod .ar{margin-left:auto;color:#C9CDD4}
/* success */
.succ{display:flex;flex-direction:column;align-items:center;padding:calc(42px + env(safe-area-inset-top)) 24px 24px;text-align:center}
.succ .ok{width:66px;height:66px;border-radius:50%;background:linear-gradient(140deg,#FFB020,#FF6A13);display:grid;place-items:center;box-shadow:0 12px 26px rgba(255,106,19,.28)}
.succ .ok svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.succ h2{margin:18px 0 6px;font-size:19px;letter-spacing:-.3px}
.succ p{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.7}
.ticket{width:100%;margin-top:22px;background:#fff;border:1px solid #F0F1F4;border-radius:16px;padding:16px;text-align:left;box-shadow:var(--shadow)}
.ticket .tr{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;color:#5E626A}
.ticket .tr b{color:var(--ink);font-weight:600}
.ticket .code{margin-top:10px;padding-top:12px;border-top:1px dashed #E8EAEE;display:flex;align-items:center;justify-content:space-between}
.ticket .code span{font-size:11px;color:var(--ink-3)}
.ticket .code b{font-size:15px;letter-spacing:1.5px;font-weight:700;font-variant-numeric:tabular-nums}
.succ-btns{display:flex;gap:10px;width:100%;margin-top:18px}
.succ-btns button{flex:1;height:44px;border-radius:13px;font-size:14px;font-weight:600}
.succ-btns .ghost{background:#F4F5F7;color:#4A4E55}
.succ-btns .solid{background:linear-gradient(135deg,#FF8A3D,#F5520A);color:#fff}
/* animations */
.fade-in{animation:fadeIn .26s ease both}
@keyframes fadeIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide-in{animation:slideIn .28s cubic-bezier(.3,.9,.3,1) both}
@keyframes slideIn{from{transform:translateX(22%);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* extra */
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px}
.pcard{flex:0 0 134px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.pcard .ph{height:72px;position:relative;overflow:hidden}
.pcard .ph em{position:absolute;left:9px;bottom:8px;font-style:normal;font-size:9.5px;color:#fff;background:rgba(0,0,0,.2);padding:2px 6px;border-radius:5px;backdrop-filter:blur(4px)}
.pcard .pb{padding:9px 10px 11px}
.pcard .pb b{font-size:12.5px;line-height:1.35;display:block;height:34px;overflow:hidden;letter-spacing:-.2px}
.pcard .pb p{margin:5px 0 0;font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:2px}
.tabbar.hide{display:none}
@media(max-width:559px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:430px;margin:0 auto}
}
.detail .scroll{padding-bottom:88px}
.hide{display:none!important}

/* ================= v2 polish ================= */
:root{
  --r:20px;
  --shadow:0 6px 20px rgba(24,26,32,.055),0 1px 2px rgba(24,26,32,.04);
  --shadow-lg:0 16px 40px rgba(24,26,32,.10);
}
.phone{background:#F5F6F8}
.view{background:transparent}
button{-webkit-tap-highlight-color:transparent}
.gitem,.pcard,.article,.ind,.mrow,.qprod,.opt,.ask-chip,.ptab,.pitem,.tab{transition:transform .16s ease,background-color .16s ease,color .2s ease}
.gitem:active,.pcard:active{transform:scale(.955)}
.pitem:active,.mrow:active,.ind:active,.article:active{background:#FAFAFC}
.ask-chip:active,.opt:active,.ptab:active,.qopt:active{transform:scale(.95)}
.primary:active,.ask-go:active,.sbtn:active,.qprod:active,.succ-btns button:active,.selbar button:active{transform:scale(.975)}

/* tab bar */
.tab{position:relative}
.tab svg{transition:transform .24s cubic-bezier(.3,1.5,.5,1)}
.tab.on svg{transform:translateY(-2px) scale(1.05)}
.tab.ai .aiball{transition:transform .24s cubic-bezier(.3,1.5,.5,1),box-shadow .24s}
.tab.on .aiball{transform:translateY(-2px) scale(1.06);box-shadow:0 6px 16px rgba(255,90,12,.42)}
.tab.on::after{content:"";position:absolute;top:0;width:22px;height:2.5px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,#FFB020,#FF5A0C)}
.tab.ai.on::after{display:none}

/* hero */
.hero{background:linear-gradient(165deg,#FF9A48 0%,#FF6C16 42%,#F04E00 100%);border-radius:0 0 28px 28px}
.hero::before{width:280px;height:280px;right:-100px;top:-150px;background:radial-gradient(circle,rgba(255,255,255,.36),rgba(255,255,255,0) 64%)}
.greet h1{font-size:22px;line-height:1.34}
.greet p{margin-top:8px}
.avatar .ring{inset:-5px;border:1.5px solid rgba(255,255,255,.6)}
.avatar svg{border-radius:50%}
.ask{box-shadow:0 14px 34px rgba(150,55,0,.16);padding:17px 16px 12px}
.ask-chip{transition:transform .15s ease,background .18s,border-color .18s;position:relative;overflow:hidden}
.ask-chip.on{box-shadow:0 4px 10px rgba(255,106,19,.14)}
.searchbox{box-shadow:inset 0 1px 2px rgba(0,0,0,.03)}

/* grid */
.gicon{width:46px;height:46px;border-radius:15px;box-shadow:0 7px 14px -8px currentColor,inset 0 1px 0 rgba(255,255,255,.7)}
.gitem span{font-size:11.5px;color:#43474E}
.gitem:active .gicon{transform:scale(.94);transition:transform .16s}

/* quota */
.quota{box-shadow:0 8px 20px -12px rgba(240,78,0,.5)}
.quota .q-bar i{width:0;transition:width 1s cubic-bezier(.2,.85,.3,1)}
.q-num{font-feature-settings:"tnum"}

/* banner */
.banner{height:112px;box-shadow:0 10px 24px -14px rgba(80,40,10,.55)}
.bslide h4{font-size:17px}
.bdots{gap:5px;bottom:10px}
.bdots i{width:5px;height:3px;border-radius:2px;background:rgba(255,255,255,.5);transition:width .35s,background .35s}
.bdots i.on{width:15px;background:#fff}

/* section titles */
.section-title h3{font-size:17px;font-weight:700;letter-spacing:-.4px}
.section-title{padding:0 18px}

/* cards */
.mod,.dcard,.rec,.stat-cell,.mcard,.task,.signin,.ind,.article,.pcard{box-shadow:var(--shadow)}
.mod{border-radius:20px}
.mod-ico{border-radius:14px}
.pitem .ck{transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .18s,border-color .18s}
.pitem.sel .ck{transform:scale(1.04)}
.pitem.sel{background:linear-gradient(90deg,#FFF8F1,#fff 70%)}
.pitem.sel .pi b{color:var(--orange-d)}

/* selection bar */
.selbar{transform:translateY(160%);opacity:0;transition:transform .34s cubic-bezier(.22,.95,.3,1),opacity .3s}
.selbar.show{transform:none;opacity:1}
.selbar .s1 b{display:inline-block;transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.selbar.bump .s1 b{transform:scale(1.4)}

/* mini header + detail fixed nav */
.mini{
  position:absolute;left:0;right:0;top:0;z-index:45;height:calc(70px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:9px;
  padding:0 14px;background:#fff;
  border-bottom:1px solid rgba(24,26,32,.06);box-shadow:0 4px 16px rgba(24,26,32,.04);transform:translateY(-102%);transition:transform .3s cubic-bezier(.3,.95,.3,1);
  pointer-events:none;
}
.mini.on{transform:none;pointer-events:auto}
.mini .mt{font-size:13.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.mini .ms{flex:1;height:32px;border-radius:16px;background:#F4F5F7;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;color:#9AA0A8;min-width:0}
.mini .ms svg{width:14px;height:14px;stroke:#AEB3BB;fill:none;stroke-width:2.2}
.mini .mb{position:relative;width:28px;height:28px;display:grid;place-items:center;color:#5E626A}
.mini .mb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.dnav-fixed{
  position:absolute;left:0;right:0;top:0;z-index:46;height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:10px;padding:0 14px;
  background:#fff;border-bottom:1px solid rgba(24,26,32,.06);box-shadow:0 4px 16px rgba(24,26,32,.04);
  transform:translateY(-102%);transition:transform .3s cubic-bezier(.3,.95,.3,1);pointer-events:none;
}
.dnav-fixed.on{transform:none;pointer-events:auto}
.dnav-fixed b{font-size:14.5px;letter-spacing:-.2px;flex:1;text-align:center;margin-right:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnav-fixed .bck{width:30px;height:30px;display:grid;place-items:center;margin-left:-6px}
.dnav-fixed .bck svg{width:21px;height:21px;stroke:#191A1C;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* detail */
.detail-hero{border-radius:0 0 26px 26px}
.dcard{animation:cardIn .42s cubic-bezier(.22,.9,.3,1)}
.dcard:nth-of-type(2){animation-delay:.04s}
.dcard:nth-of-type(3){animation-delay:.08s}
.dcard:nth-of-type(4){animation-delay:.12s}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dock{box-shadow:0 -8px 24px rgba(24,26,32,.05)}

/* services segment */
.seg{display:flex;gap:6px;padding:0 14px;margin:0 0 10px}
.seg button{padding:7px 14px;border-radius:12px;font-size:12.5px;color:#6E737B;background:#fff;box-shadow:var(--shadow);transition:.18s}
.seg button.on{background:#191A1C;color:#fff;font-weight:600}

/* success */
.succ .ok{animation:popIn .55s cubic-bezier(.2,1.35,.4,1) both}
@keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.succ .ok svg path{stroke-dasharray:34;stroke-dashoffset:34;animation:draw .5s .22s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ticket{animation:rise .5s .2s cubic-bezier(.22,.9,.3,1) both}
.succ h2,.succ p{animation:rise .45s .12s cubic-bezier(.22,.9,.3,1) both}
.succ-btns{animation:rise .45s .3s cubic-bezier(.22,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* sheet */
.sheet{border-radius:26px 26px 0 0;box-shadow:0 -18px 50px rgba(20,22,26,.18)}
.sheet::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:#E7E9ED}
.sheet-h{padding:24px 18px 10px}
.sheet .primary{transition:transform .15s}

/* search */
mark{background:transparent;color:var(--orange-d);font-weight:700}
.sv-row{transition:background .15s}
.sv-row:active{background:#FAFAFC}
.recent{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}

/* favorites */
.dock .fav.on{color:#F59E0B}
.dock .fav.on svg{fill:#FFB020;stroke:#FFB020}
.qres{animation:popIn .42s cubic-bezier(.2,1.1,.4,1) both}
.qopt{animation:cardIn .3s cubic-bezier(.22,.9,.3,1) both}

/* page transitions */
.view.fade-in{animation:tabIn .32s cubic-bezier(.22,.85,.3,1)}
@keyframes tabIn{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.view.slide-in{animation:pushIn .34s cubic-bezier(.22,.9,.28,1)}
@keyframes pushIn{from{opacity:.5;transform:translateX(26%)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= home v4 · service first ================= */
.heroS{
  position:relative;overflow:hidden;padding-bottom:30px;border-radius:0 0 30px 30px;
  background:

  else if(p.mod==='special')f=[{k:'way',label:'服务方式',opts:['电话咨询','视频咨询','面对面']},date,time];

function confirmBooking(){

  const dateF=fields.find(f=>f.k==='date'), timeF=fields.find(f=>f.k==='time');

const SEARCH_SYN={
 '快通':['快通','就医','挂号','陪诊','绿通'],
 '绿通':['快通','就医'],
 '体检':['体检','检查','筛查'],
 '报告':['报告','解读','结论'],
 '解读':['解读','报告'],
 '睡眠':['睡眠','失眠','鼾','OSAS'],
 '改善':['改善','失眠','调理','康复','睡眠'],
 '心理':['心理','EAP','情绪','压力'],
 '咨询':['咨询','EAP','问诊','面诊'],
 '减重':['减重','体重','脂肪肝','肥胖'],
 '五高':['五高','血压','血糖','血脂','尿酸'],
 '慢病':['慢病','五高','血压','血糖','减重','体重','结节','康复'],
 '就医':['就医','挂号','陪诊','住院'],
 '挂号':['挂号','就医','快通'],
 '急救':['急救','CPR','AED','心肺'],
 '讲座':['讲座','沙龙','直播'],
 '肿瘤':['肿瘤','重疾','癌症'],
 '胃镜':['胃镜','胃肠镜','消化'],
 '颈椎':['颈椎','颈肩','腰腿','中医','康复'],
 '康复':['康复','理疗','推拿','针灸'],
 '血糖':['血糖','糖尿病','五高'],
 '血压':['血压','高血压','心脑'],
 '结节':['结节','肺','CT']
};
function normQ(s){return (s||'').toLowerCase().replace(/[\s·（）()、,，/\-]/g,'');}
function pHay(p){
  const m=MODULES.find(x=>x.id===p.mod);
  return normQ([p.name,p.intro,p.suit,p.tags.join(''),p.includes.join(''),m.name,m.sub].join(''));
}
function searchProducts(q){
  const nq=normQ(q); if(!nq)return [];
  const grams=[];
  if(nq.length===1)grams.push(nq);
  for(let i=0;i<nq.length-1;i++)grams.push(nq.slice(i,i+2));
  const uniq=[...new Set(grams)];
  const res=[];
  PRODUCTS.forEach(p=>{
    const m=MODULES.find(x=>x.id===p.mod);
    const fName=normQ(p.name), fTag=normQ(p.tags.join('')), fInc=normQ(p.includes.join('')),
          fRest=normQ(p.intro+p.suit), fMod=normQ(m.name+m.sub);
    let total=0,nameHits=0;
    uniq.forEach(g=>{
      const syns=[g].concat(SEARCH_SYN[g]||[]).map(normQ);
      let w=0;
      syns.forEach(x=>{
        if(!x)return;
        if(fName.includes(x))w=Math.max(w,8);
        else if(fTag.includes(x))w=Math.max(w,4);
        else if(fInc.includes(x))w=Math.max(w,3);
        else if(fRest.includes(x))w=Math.max(w,1);
        else if(fMod.includes(x))w=Math.max(w,2);
      });
      total+=w;
      if(w===8)nameHits++;
    });
    if(nameHits>0||total>=10)res.push({p,score:total*10+nameHits});
  });
  return res.sort((a,b)=>b.score-a.score).map(x=>x.p).slice(0,12);
}

function searchRows(list,q){
  if(!list.length)return '<div class="empty">没有找到相关服务，试试"体检"或"心理"</div>';
  return list.map(p=>`<div class="sv-row" onclick="fromSearch('${p.id}')">

    <div><div>${hi(p.name,q)}</div><div style="font-size:10.5px;color:#B4B9C1;margin-top:2px">${modOf(p.mod).name} · ${p.scope}</div></div>
    <span>${p.tags[0]}</span>
  </div>`).join('');
}
function hi(t,q){
  if(!q)return t;
  const low=t.toLowerCase(), nq=q.toLowerCase();
  let i=low.indexOf(nq), len=nq.length;
  if(i<0){
    const grams=[]; for(let k=0;k<nq.length-1;k++)grams.push(nq.slice(k,k+2));
    for(const g of grams){const j=low.indexOf(g); if(j>=0){i=j;len=g.length;break;}}
  }
  if(i<0)return t;
  return t.slice(0,i)+'<mark>'+t.slice(i,i+len)+'</mark>'+t.slice(i+len);
}

  const nm=prod(id).name;

function spark(vals,color){
  const w=64,h=22,min=Math.min(...vals),max=Math.max(...vals),r=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-min)/r)*(h-6)-3).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

}

function goTab(id){
  state.tab=id; state.view='tab'; state.hist=[]; state.filter=state.filter||'';
  closeSearch(); closeQA(); render();
}
function renderTabbar(){
  const tb=$('tabbar');
  if(state.view!=='tab'){tb.classList.add('hide');return;}
  tb.classList.remove('hide');
  tb.innerHTML=TABS.map(t=>`<button class="tab ${state.tab===t.id?'on':''} ${t.ai?'ai':''}" onclick="goTab('${t.id}')">
    ${t.ai?'<div class="aiball">Ai</div>':ico(t.icon)}<span>${t.label}</span>
  </button>`).join('');
}
const VIEWS={home:homeHTML,products:productsHTML,discover:discoverHTML,mine:mineHTML};
let bannerTimer=null;
function startBanner(){
  clearInterval(bannerTimer);
  let i=0;
  bannerTimer=setInterval(()=>{
    const slides=document.querySelectorAll('.bslide'), dots=document.querySelectorAll('.bdots i');
    if(!slides.length){clearInterval(bannerTimer);return;}
    i=(i+1)%slides.length;
    slides.forEach((s,n)=>s.classList.toggle('on',n===i));
    dots.forEach((d,n)=>d.classList.toggle('on',n===i));
  },3800);
}
function mount(){
  const sc=document.querySelector('.scroll');
  const mini=document.getElementById('miniBar'), dn=document.getElementById('dnavFixed');
  if(sc&&(mini||dn)){
    sc.addEventListener('scroll',()=>{
      const y=sc.scrollTop;
      if(mini)mini.classList.toggle('on',y>112);
      if(dn)dn.classList.toggle('on',y>96);
    },{passive:true});
  }
  document.querySelectorAll('.q-bar i[data-w]').forEach(el=>{
    el.style.width='0';
    setTimeout(()=>{el.style.width=el.dataset.w;},80);
  });
}
function render(){
  const root=$('root');
  if(state.view==='tab'){root.innerHTML=VIEWS[state.tab]();}
  else if(state.view==='detail'){root.innerHTML=detailHTML(prod(state.product));}
  else if(state.view==='booking'){root.innerHTML=bookingHTML();}
  else if(state.view==='lecture'){root.innerHTML=lectureHTML();}
  else if(state.view==='article'){root.innerHTML=articleHTML();}
  else if(state.view==='apps'){root.innerHTML=appsHTML();}
  else if(state.view==='messages'){root.innerHTML=messagesHTML();}
  else if(state.view==='quota'){root.innerHTML=quotaHTML();}
  else if(state.view==='industry'){root.innerHTML=industryHTML();}
  else if(state.view==='five'){root.innerHTML=fiveHTML();}
  else if(state.view==='rights'){root.innerHTML=rightsHTML();}
  else if(state.view==='category'){root.innerHTML=categoryHTML();}
  else if(state.view==='archive'){root.innerHTML=archiveHTML();}
  else if(state.view==='lectures'){root.innerHTML=lecturesHTML();}
  else if(state.view==='success'){root.innerHTML=successHTML();}
  renderTabbar();
  const sc=document.querySelector('.scroll'); if(sc)sc.scrollTop=0;
  if(state.view==='tab'&&state.tab==='home')startBanner(); else clearInterval(bannerTimer);
  mount();
}
fitViewport();
render();

</script>
